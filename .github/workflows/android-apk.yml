name: Android APK

on:
  push:
    branches: [master, main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-app
        shell: bash
    env:
      RCT_REACT_NATIVE_MAVEN_MIRROR_ENABLED: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      - name: Install pnpm and dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@7ca78c16c887dc6c5f36fd6d0cb0f5c23d940e69 # v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Check TypeScript and browsing rules
        run: |
          pnpm typecheck
          pnpm test

      - name: Restore stable APK signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo '::error::Configure ANDROID_DEBUG_KEYSTORE_BASE64 in repository Actions secrets.'
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dazo-debug.keystore"
          echo "DAZO_DEBUG_KEYSTORE=$RUNNER_TEMP/dazo-debug.keystore" >> "$GITHUB_ENV"

      - name: Build standalone APK
        run: ./gradlew assembleDebug --no-daemon --max-workers=4 --stacktrace -PappVersionName="1.1.0-${GITHUB_SHA:0:7}"

      - name: Prepare APK and checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/DazoMobile.apk
          cd dist
          sha256sum DazoMobile.apk > DazoMobile.apk.sha256

      - name: Upload APK
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: DazoMobile-${{ github.run_number }}
          path: android-app/dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Link APK in build summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          printf '### Android APK\n\n[Download APK and SHA-256](%s)\n\nCommit: `%s`\n' "$ARTIFACT_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/dazo-debug.keystore"
