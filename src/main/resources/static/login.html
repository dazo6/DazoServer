<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>登录 · Fanbox Admin</title>
    <style>
        :root {
            color: #172033;
            background: #edf3f8;
            font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 0;
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .login-card {
            width: min(420px, 100%);
            border: 1px solid #dde7ef;
            border-radius: 18px;
            padding: 36px;
            background: #fff;
            box-shadow: 0 24px 65px rgba(40, 57, 84, .13);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
            margin-bottom: 32px;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            color: #fff;
            background: linear-gradient(145deg, #218ec5, #55bfda);
            box-shadow: 0 8px 20px rgba(33, 142, 197, .25);
            font-weight: 800;
        }

        .brand strong, .brand small {
            display: block;
        }

        .brand strong {
            font-size: 16px;
        }

        .brand small {
            margin-top: 3px;
            color: #7a8798;
            font-size: 11px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 26px;
            letter-spacing: -.03em;
        }

        .intro {
            margin: 0 0 26px;
            color: #687386;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 17px 0 7px;
            color: #465568;
            font-size: 13px;
            font-weight: 650;
        }

        input {
            width: 100%;
            height: 44px;
            border: 1px solid #d7e0e8;
            border-radius: 9px;
            padding: 0 13px;
            color: #172033;
            background: #fff;
            font: inherit;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }

        input:focus {
            border-color: #218ec5;
            box-shadow: 0 0 0 3px rgba(33, 142, 197, .13);
        }

        button {
            width: 100%;
            height: 44px;
            margin-top: 25px;
            border: 0;
            border-radius: 9px;
            color: #fff;
            background: #218ec5;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 7px 18px rgba(33, 142, 197, .22);
        }

        button:hover {
            background: #197eaf;
        }

        button:disabled {
            cursor: wait;
            opacity: .65;
        }

        .error {
            min-height: 20px;
            margin: 14px 0 -5px;
            color: #c43d4b;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            body {
                align-items: center;
                padding: 16px;
            }

            .login-card {
                padding: 28px 22px;
            }

            input {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
<main class="login-card">
    <div class="brand">
        <span class="brand-mark">F</span>
        <span><strong>Fanbox Admin</strong><small>Crawler Console</small></span>
    </div>
    <h1>登录</h1>
    <p class="intro">请输入配置文件中设置的用户 ID 和密码。</p>
    <form id="login-form">
        <label for="user-id">用户 ID</label>
        <input id="user-id" name="userId" autocomplete="username" required autofocus>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p id="error-message" class="error" role="alert" aria-live="polite"></p>
        <button id="submit-button" type="submit">登录</button>
    </form>
</main>
<script>
    (() => {
        "use strict";
        const form = document.getElementById("login-form");
        const errorMessage = document.getElementById("error-message");
        const submitButton = document.getElementById("submit-button");
        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            errorMessage.textContent = "";
            submitButton.disabled = true;
            submitButton.textContent = "登录中…";
            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {"Content-Type": "application/json", Accept: "application/json"},
                    body: JSON.stringify({
                        userId: form.elements.userId.value,
                        password: form.elements.password.value
                    })
                });
                const result = await response.json();
                if (!response.ok || result.result !== "SUCCESS") {
                    throw new Error(result.message || "登录失败");
                }
                const requested = new URLSearchParams(location.search).get("redirect");
                const target = requested && requested.startsWith("/") && !requested.startsWith("//")
                    ? requested : "/dashboard/";
                location.replace(target);
            } catch (error) {
                errorMessage.textContent = error.message || "登录失败，请稍后重试";
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "登录";
            }
        });
    })();
</script>
</body>
</html>
