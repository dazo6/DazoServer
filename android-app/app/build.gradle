apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'
react {
    root = file('..')
    reactNativeDir = file('../node_modules/react-native')
    codegenDir = file('../node_modules/@react-native/codegen')
    cliFile = file('../node_modules/react-native/cli.js')
    entryFile = file('../index.js')
    debuggableVariants = []
    autolinkLibrariesWithApp()
}

android {
    namespace 'com.dazo66.android'
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    ndkVersion rootProject.ext.ndkVersion
    signingConfigs {
        debug {
            if (System.getenv('DAZO_DEBUG_KEYSTORE')) {
                storeFile file(System.getenv('DAZO_DEBUG_KEYSTORE'))
            }
            storePassword 'android'
            keyAlias 'AndroidDebugKey'
            keyPassword 'android'
        }
    }
    defaultConfig {
        applicationId 'com.dazo66.android'
        minSdk 26
        targetSdk rootProject.ext.targetSdkVersion
        versionCode providers.gradleProperty('appVersionCode').getOrElse('5').toInteger()
        versionName providers.gradleProperty('appVersionName').getOrElse('1.4.0')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation('com.facebook.react:react-android')
    implementation('com.facebook.react:hermes-android')
    implementation('com.facebook.fresco:animated-gif:3.7.0')
    implementation('com.facebook.fresco:animated-webp:3.7.0')
    implementation('com.facebook.fresco:webpsupport:3.7.0')
    implementation('androidx.media3:media3-exoplayer:1.11.1')
    implementation('androidx.media3:media3-ui:1.11.1')
    testImplementation('junit:junit:4.13.2')
}
