<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Fanbox Crawl Dashboard</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/dashboard/vendor/element-plus.css">
    <link rel="stylesheet" href="/dashboard/vendor/xgplayer/index.min.css">
    <link rel="stylesheet" href="/dashboard/dashboard.css">
</head>
<body>
<div id="app" v-cloak>
    <el-container class="app-layout">
        <el-aside class="app-sidebar" width="230px">
            <router-link class="brand" to="/" aria-label="返回仪表盘首页">
                <span class="brand-mark">F</span>
                <span>
                    <strong>Fanbox Admin</strong>
                    <small>Crawler Console</small>
                </span>
            </router-link>
            <nav class="app-nav" aria-label="主导航">
                <p class="nav-group-title">总览</p>
                <el-menu router :default-active="$route.path">
                    <el-menu-item index="/">仪表盘</el-menu-item>
                    <el-menu-item-group title="管理">
                        <el-menu-item index="/manage/artists">画师管理</el-menu-item>
                        <el-menu-item index="/manage/free-galleries">自由画廊</el-menu-item>
                        <el-menu-item v-if="can('read', '*')" index="/manage/history">历史爬取记录</el-menu-item>
                    <el-menu-item v-if="authState.user?.isSuperAdmin" index="/manage/scheduled-tasks">定时任务管理</el-menu-item>
                    <el-menu-item v-if="can('read', 'op:user.list')" index="/manage/users">用户管理</el-menu-item>
                    </el-menu-item-group>
                </el-menu>
            </nav>
            <div class="sidebar-account" v-if="authState.user">
                <router-link class="sidebar-user" to="/manage/account" aria-label="账户设置" title="账户设置">
                    <el-avatar :size="32" :src="'/api/users/avatar?userId='+encodeURIComponent(authState.user.userId)+'&t='+authState.avatarStamp"></el-avatar>
                    <span>{{ authState.user.username }}</span>
                </router-link>
            </div>
        </el-aside>
        <el-main class="dashboard-shell">
            <router-view></router-view>
        </el-main>
    </el-container>
</div>

<template id="dashboard-home-template">
    <div>
        <el-alert v-if="errorMessage" class="dashboard-alert" :title="errorMessage" type="error"
                  show-icon :closable="false"></el-alert>

        <el-card class="dashboard-card timeline-card" shadow="never" aria-labelledby="timeline-title">
            <template #header>
                <div class="card-heading">
                    <div>
                        <p class="section-kicker">HOURLY ACTIVITY</p>
                        <h2 id="timeline-title">Fanbox Crawler Done With Time Line</h2>
                    </div>
                    <div class="metric">
                        <span>150 小时总计</span>
                        <strong>{{ formattedTimelineTotal }}</strong>
                        <small class="refresh-status" :class="{ active: refreshing }">
                            <i aria-hidden="true"></i>{{ refreshing ? '正在更新' : '每分钟自动更新' }}
                            <template v-if="lastUpdated"> · {{ lastUpdated }}</template>
                        </small>
                    </div>
                </div>
            </template>
            <div ref="timelineChart" class="timeline-chart" :class="{ skeleton: loading && !hourlyCounts.length }"
                 aria-label="按小时统计的抓取请求折线图"></div>
        </el-card>

        <div class="lower-grid">
            <el-card class="dashboard-card status-card" shadow="never" aria-labelledby="status-title">
                <template #header>
                    <div class="card-heading">
                        <div>
                            <p class="section-kicker">REQUEST STATUS</p>
                            <h2 id="status-title">Fanbox Crawler Done Percent</h2>
                        </div>
                    </div>
                </template>
                <div ref="statusChart" class="status-chart" :class="{ skeleton: loading && !statusTotal }"
                     role="img" :aria-label="statusAriaLabel"></div>
            </el-card>

            <el-card class="dashboard-card artists-card" shadow="never" aria-labelledby="artists-title">
                <template #header>
                    <div class="card-heading artists-heading">
                        <div>
                            <p class="section-kicker">LATEST UPDATES</p>
                            <h2 id="artists-title">Last Update Artist</h2>
                        </div>
                        <el-input v-model.trim="searchKeyword" class="artist-search" clearable
                                  placeholder="搜索名称或 ID"></el-input>
                    </div>
                </template>
                <el-table class="responsive-desktop-table" :data="pagedArtists" stripe table-layout="fixed"
                          empty-text="没有匹配的艺术家"
                          v-loading="loading && !artists.length">
                    <el-table-column label="name" min-width="260">
                        <template #default="scope">
                            <div class="artist-cell dashboard-artist-cell" :class="{ 'has-banner': scope.row.banner }">
                                <img v-if="scope.row.banner" class="artist-banner" :src="scope.row.banner"
                                     alt="" aria-hidden="true" @error="hideBrokenArtistImage(scope.row, 'banner')">
                                <el-avatar :size="36" :src="scope.row.icon" :alt="scope.row.name"
                                           @error="hideBrokenArtistImage(scope.row, 'icon')">
                                    {{ scope.row.name ? scope.row.name.slice(0, 1) : '?' }}
                                </el-avatar>
                                <span class="dashboard-artist-name">{{ scope.row.name }}</span>
                            </div>
                        </template>
                    </el-table-column>
                    <el-table-column prop="last" label="last" width="180" align="right"></el-table-column>
                </el-table>
                <div class="responsive-mobile-list dashboard-mobile-artists"
                     v-loading="loading && !artists.length">
                    <div v-if="!loading && !pagedArtists.length" class="mobile-empty">没有匹配的艺术家</div>
                    <article v-for="row in pagedArtists" :key="row.name + ':' + row.last"
                             class="mobile-dashboard-artist">
                        <div class="artist-cell dashboard-artist-cell" :class="{ 'has-banner': row.banner }">
                            <img v-if="row.banner" class="artist-banner" :src="row.banner"
                                 alt="" aria-hidden="true" @error="hideBrokenArtistImage(row, 'banner')">
                            <el-avatar :size="40" :src="row.icon" :alt="row.name"
                                       @error="hideBrokenArtistImage(row, 'icon')">
                                {{ row.name ? row.name.slice(0, 1) : '?' }}
                            </el-avatar>
                            <span class="dashboard-artist-name">{{ row.name }}</span>
                        </div>
                        <time class="mobile-dashboard-last">上次更新 {{ row.last || '—' }}</time>
                    </article>
                </div>
                <div class="table-footer">
                    <span>{{ artistInfo }}</span>
                    <el-pagination v-model:current-page="currentPage" background layout="prev, pager, next"
                                   :page-size="pageSize" :total="filteredArtistCount"></el-pagination>
                </div>
            </el-card>
        </div>
    </div>
</template>

<template id="artist-management-template">
    <el-card class="dashboard-card management-card" shadow="never">
        <template #header>
            <div class="management-heading">
                <div>
                    <p class="section-kicker">MANAGEMENT</p>
                    <h2>画师管理</h2>
                </div>
                <el-button type="primary" :disabled="!can('update', 'op:artist.create')" @click="openCreateDialog">新增画师</el-button>
            </div>
        </template>

        <el-form class="filter-form" :inline="true" @submit.prevent="loadArtists(1)">
            <el-form-item label="关键字">
                <el-input v-model.trim="filters.keyword" clearable placeholder="画师名称"
                          @keyup.enter="loadArtists(1)"></el-input>
            </el-form-item>
            <el-form-item label="状态">
                <el-select v-model="filters.enabled" clearable placeholder="全部状态" style="width: 130px">
                    <el-option label="已启用" :value="true"></el-option>
                    <el-option label="已停用" :value="false"></el-option>
                </el-select>
            </el-form-item>
            <el-form-item label="更新时间">
                <el-select v-model="filters.lastUpdateOrder" style="width: 140px">
                    <el-option label="最新在前" value="desc"></el-option>
                    <el-option label="最早在前" value="asc"></el-option>
                </el-select>
            </el-form-item>
            <el-form-item>
                <el-button type="primary" native-type="submit">查询</el-button>
                <el-button @click="resetFilters">重置</el-button>
            </el-form-item>
        </el-form>

        <el-table class="artist-management-table responsive-desktop-table" :row-class-name="permissionRowClass" :data="rows" row-key="id" stripe
                  table-layout="fixed" empty-text="没有匹配的画师"
                  v-loading="loading">
            <el-table-column label="名称" min-width="680">
                <template #default="scope">
                    <div :inert="!canArtist(scope.row, 'canOpenGallery') ? '' : null" class="artist-cell artist-gallery-link" :class="{ 'has-banner': scope.row.banner }"
                         :aria-disabled="!canArtist(scope.row, 'canOpenGallery')" role="link" :tabindex="canArtist(scope.row, 'canOpenGallery') ? 0 : -1" :aria-label="'查看 ' + scope.row.name + ' 的图库'"
                         @click="openGallery(scope.row)"
                         @keydown.enter.prevent="openGallery(scope.row)"
                         @keydown.space.prevent="openGallery(scope.row)">
                        <img v-if="scope.row.banner" class="artist-banner" :src="scope.row.banner"
                             alt="" aria-hidden="true" @error="hideBrokenImage(scope.row, 'banner')">
                        <a class="artist-avatar-link" :href="scope.row.url" target="_blank"
                           rel="noopener noreferrer" :aria-label="'打开 ' + scope.row.name + ' 作者主页'"
                           @click.stop>
                            <el-avatar :size="48" :src="scope.row.icon" :alt="scope.row.name"
                                       @error="hideBrokenImage(scope.row, 'icon')">
                                {{ scope.row.name ? scope.row.name.slice(0, 1) : '?' }}
                            </el-avatar>
                        </a>
                        <a class="artist-link" :href="scope.row.url" target="_blank" rel="noopener noreferrer"
                           @click.stop>{{ scope.row.name }}</a>
                    </div>
                </template>
            </el-table-column>
            <el-table-column prop="type" label="类型" width="180"></el-table-column>
            <el-table-column prop="lastUpdate" label="上次更新" width="180"></el-table-column>
            <el-table-column label="压缩" width="100" align="center">
                <template #default="scope">
                    <el-button class="compression-toggle" size="small" plain
                               :type="scope.row.compression ? 'success' : 'info'"
                               :loading="updatingKeys.has(`${scope.row.id}:compression`)"
                               :disabled="!canArtist(scope.row, 'canOpenGallery') || !canArtist(scope.row, 'canCompression')" @click="toggleCompression(scope.row)">
                        {{ scope.row.compression ? '开启' : '关闭' }}
                    </el-button>
                </template>
            </el-table-column>
            <el-table-column label="启用" width="100" align="center">
                <template #default="scope">
                    <el-switch :disabled="!canArtist(scope.row, 'canOpenGallery') || !canArtist(scope.row, 'canStatus')" v-model="scope.row.enable" :loading="updatingKeys.has(`${scope.row.id}:status`)"
                               @change="updateStatus(scope.row)"></el-switch>
                </template>
            </el-table-column>
        </el-table>

        <div class="responsive-mobile-list mobile-artist-list" v-loading="loading">
            <div v-if="!loading && !rows.length" class="mobile-empty">没有匹配的画师</div>
            <article v-for="row in rows" :key="row.id" class="mobile-artist-row" :class="{ 'permission-masked': !canArtist(row, 'canOpenGallery') }" :aria-label="!canArtist(row, 'canOpenGallery') ? '无权查看' : null">
                <div :inert="!canArtist(row, 'canOpenGallery') ? '' : null" class="artist-cell mobile-artist-hero artist-gallery-link"
                     :class="{ 'has-banner': row.banner }" :aria-disabled="!canArtist(row, 'canOpenGallery')" role="link" :tabindex="canArtist(row, 'canOpenGallery') ? 0 : -1"
                     :aria-label="'查看 ' + row.name + ' 的图库'"
                     @click="openGallery(row)"
                     @keydown.enter.prevent="openGallery(row)"
                     @keydown.space.prevent="openGallery(row)">
                    <img v-if="row.banner" class="artist-banner" :src="row.banner"
                         alt="" aria-hidden="true" @error="hideBrokenImage(row, 'banner')">
                    <a class="artist-avatar-link" :href="row.url" target="_blank"
                       rel="noopener noreferrer" :aria-label="'打开 ' + row.name + ' 作者主页'"
                       @click.stop @keydown.stop>
                        <el-avatar :size="52" :src="row.icon" :alt="row.name"
                                   @error="hideBrokenImage(row, 'icon')">
                            {{ row.name ? row.name.slice(0, 1) : '?' }}
                        </el-avatar>
                    </a>
                    <a class="artist-link" :href="row.url" target="_blank"
                       rel="noopener noreferrer" @click.stop @keydown.stop>{{ row.name }}</a>
                    <button class="mobile-artist-expand" :class="{ 'is-expanded': isRowExpanded(row) }"
                            type="button" :aria-label="isRowExpanded(row) ? '收起画师信息' : '展开画师信息'"
                            :aria-expanded="String(isRowExpanded(row))"
                            :aria-controls="'mobile-artist-details-' + row.id"
                            @click.stop="toggleRowDetails(row)" @keydown.stop>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="m6 9 6 6 6-6" fill="none" stroke="currentColor"
                                  stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                        </svg>
                    </button>
                </div>
                <transition name="artist-details">
                    <div v-if="isRowExpanded(row)" :id="'mobile-artist-details-' + row.id"
                         class="mobile-artist-details">
                        <div class="mobile-data-field">
                            <small>类型</small><span>{{ row.type || '—' }}</span>
                        </div>
                        <div class="mobile-data-field mobile-update-field">
                            <small>上次更新</small>
                            <time>{{ row.lastUpdate || '—' }}</time>
                        </div>
                        <div class="mobile-setting-field">
                            <span>压缩</span>
                            <el-button class="compression-toggle" size="small" plain
                                       :type="row.compression ? 'success' : 'info'"
                                       :loading="updatingKeys.has(`${row.id}:compression`)"
                                       :disabled="!canArtist(row, 'canOpenGallery') || !canArtist(row, 'canCompression')" @click="toggleCompression(row)">
                                {{ row.compression ? '开启' : '关闭' }}
                            </el-button>
                        </div>
                        <div class="mobile-setting-field">
                            <span>启用</span>
                            <el-switch :disabled="!canArtist(row, 'canOpenGallery') || !canArtist(row, 'canStatus')" v-model="row.enable"
                                       :loading="updatingKeys.has(`${row.id}:status`)"
                                       @change="updateStatus(row)"></el-switch>
                        </div>
                    </div>
                </transition>
            </article>
        </div>

        <div class="management-footer">
            <span>共 {{ total }} 条</span>
            <el-pagination v-model:current-page="page" v-model:page-size="pageSize" background
                           layout="sizes, prev, pager, next" :page-sizes="[10, 20, 50, 100]" :total="total"
                           @current-change="loadArtists" @size-change="changePageSize"></el-pagination>
        </div>

        <el-dialog v-model="createDialogVisible" title="新增画师" width="min(520px, 92vw)" destroy-on-close>
            <el-form label-position="top">
                <el-form-item label="画师主页 URL" required>
                    <el-input v-model.trim="createForm.url" maxlength="1000"
                              placeholder="https://name.fanbox.cc/ 或 Kemono 画师页"></el-input>
                    <div class="form-help">支持 Fanbox 主页，以及当前 Kemono 站点的 /服务/user/画师ID 地址。</div>
                </el-form-item>
                <el-form-item label="名称（选填）">
                    <el-input v-model.trim="createForm.name" maxlength="256"
                              placeholder="不填写时从 URL 生成"></el-input>
                </el-form-item>
                <el-form-item label="下载图片时压缩">
                    <el-switch v-model="createForm.compression"></el-switch>
                </el-form-item>
            </el-form>
            <template #footer>
                <el-button @click="createDialogVisible = false">取消</el-button>
                <el-button type="primary" :loading="creating" @click="createArtist">创建</el-button>
            </template>
        </el-dialog>
    </el-card>
</template>

<template id="free-gallery-template">
    <el-card class="dashboard-card management-card" shadow="never">
        <template #header>
            <div class="management-heading">
                <div>
                    <p class="section-kicker">FREE GALLERIES</p>
                    <h2>自由画廊</h2>
                </div>
                <el-button type="primary" :disabled="!can('update', 'op:freeGallery.create')" @click="openCreateDialog">注册文件夹</el-button>
            </div>
        </template>

        <el-form class="filter-form" :inline="true" @submit.prevent="loadGalleries">
            <el-form-item label="关键字">
                <el-input v-model.trim="keyword" clearable placeholder="名称或文件夹路径"
                          @keyup.enter="loadGalleries"></el-input>
            </el-form-item>
            <el-form-item>
                <el-button type="primary" native-type="submit">查询</el-button>
                <el-button @click="resetSearch">重置</el-button>
            </el-form-item>
        </el-form>

        <el-table class="responsive-desktop-table free-gallery-table" :row-class-name="permissionRowClass" :data="rows" row-key="id" stripe
                  table-layout="fixed" empty-text="还没有注册自由画廊" v-loading="loading"
                  @row-dblclick="openGallery">
            <el-table-column prop="name" label="名称" min-width="180"></el-table-column>
            <el-table-column label="文件夹路径" min-width="420">
                <template #default="scope">
                    <button class="free-gallery-path" type="button" :disabled="!canGallery(scope.row, 'read')" :title="scope.row.folderPath"
                            @click="openGallery(scope.row)">{{ scope.row.folderPath }}
                    </button>
                </template>
            </el-table-column>
            <el-table-column prop="gmtCreate" label="创建时间" width="180"></el-table-column>
            <el-table-column prop="gmtModified" label="修改时间" width="180"></el-table-column>
            <el-table-column label="操作" width="220" align="right">
                <template #default="scope">
                    <el-button type="primary" link :disabled="!canGallery(scope.row, 'read')" @click="openGallery(scope.row)" @dblclick.stop>打开</el-button>
                    <el-button link :disabled="!canGallery(scope.row, 'read') || !canGallery(scope.row, 'update')" @click="openEditDialog(scope.row)" @dblclick.stop>编辑</el-button>
                    <el-button type="danger" link :disabled="!canGallery(scope.row, 'read') || !canGallery(scope.row, 'delete')" @click="removeGallery(scope.row)" @dblclick.stop>删除</el-button>
                </template>
            </el-table-column>
        </el-table>

        <div class="responsive-mobile-list mobile-free-gallery-list" v-loading="loading">
            <div v-if="!loading && !rows.length" class="mobile-empty">还没有注册自由画廊</div>
            <article v-for="row in rows" :key="row.id" class="mobile-free-gallery-row" :class="{ 'permission-masked': !canGallery(row, 'read') }" :aria-label="!canGallery(row, 'read') ? '无权查看' : null"
                     @dblclick="openGallery(row)">
                <button class="mobile-free-gallery-main" type="button" :disabled="!canGallery(row, 'read')" @click="openGallery(row)">
                    <strong>{{ row.name }}</strong>
                    <span>{{ row.folderPath }}</span>
                </button>
                <div class="mobile-free-gallery-meta">
                    <span>创建 {{ row.gmtCreate || '—' }}</span>
                    <span>修改 {{ row.gmtModified || '—' }}</span>
                </div>
                <footer>
                    <el-button type="primary" size="small" :disabled="!canGallery(row, 'read')" @click="openGallery(row)" @dblclick.stop>打开</el-button>
                    <el-button size="small" :disabled="!canGallery(row, 'read') || !canGallery(row, 'update')" @click="openEditDialog(row)" @dblclick.stop>编辑</el-button>
                    <el-button type="danger" size="small" plain :disabled="!canGallery(row, 'read') || !canGallery(row, 'delete')" @click="removeGallery(row)"
                               @dblclick.stop>删除
                    </el-button>
                </footer>
            </article>
        </div>

        <div class="management-footer"><span>共 {{ rows.length }} 条</span></div>

        <el-dialog v-model="dialogVisible" :title="editingId === null ? '注册自由画廊' : '编辑自由画廊'"
                   width="min(600px, 92vw)" destroy-on-close>
            <el-form label-position="top" @submit.prevent="saveGallery">
                <el-form-item label="文件夹绝对路径" required>
                    <el-input v-model.trim="form.folderPath" maxlength="2048"
                              placeholder="例如 D:\\Pictures\\Gallery"></el-input>
                    <div class="form-help">必须是服务器上已经存在且可访问的文件夹。</div>
                </el-form-item>
                <el-form-item label="文件夹名称（选填）">
                    <el-input v-model.trim="form.name" maxlength="256"
                              placeholder="留空时自动使用路径中的文件夹名称"></el-input>
                </el-form-item>
            </el-form>
            <template #footer>
                <el-button @click="dialogVisible = false">取消</el-button>
                <el-button type="primary" :loading="saving" @click="saveGallery">保存</el-button>
            </template>
        </el-dialog>
    </el-card>
</template>

<template id="artist-gallery-template">
    <el-card class="dashboard-card management-card gallery-card" shadow="never">
        <template #header>
            <div class="management-heading gallery-heading">
                <div v-if="hasArtist" class="gallery-artist-profile">
                    <img v-if="artist.banner" class="gallery-header-banner" :src="artist.banner"
                         alt="" aria-hidden="true" @error="hideArtistImage('banner')">
                    <a class="artist-avatar-link gallery-avatar-link" :href="artist.url || undefined"
                       target="_blank" rel="noopener noreferrer"
                       :aria-label="'打开 ' + artistName + ' 作者主页'">
                        <el-avatar :size="64" :src="artist.icon" :alt="artistName"
                                   @error="hideArtistImage('icon')">
                            {{ artistName ? artistName.slice(0, 1) : '?' }}
                        </el-avatar>
                    </a>
                    <div class="gallery-artist-title">
                        <p class="section-kicker">ARTIST GALLERY</p>
                        <a class="gallery-artist-name" :href="artist.url || undefined" target="_blank"
                           rel="noopener noreferrer">{{ artistName }}</a>
                    </div>
                </div>
                <div v-else class="gallery-folder-profile">
                    <div class="gallery-artist-title">
                        <p class="section-kicker">FOLDER GALLERY</p>
                        <p class="gallery-folder-path" :title="folderPath">{{ folderPath }}</p>
                    </div>
                </div>
                    <div class="gallery-upload-actions">
                        <el-progress v-if="uploading" type="circle" :width="32" :stroke-width="3" :percentage="uploadProgress" :show-text="false"></el-progress>
                        <el-button :disabled="uploading || !canUpload" @click="uploadInput.click()">{{ uploading ? '上传中 ' + uploadProgress + '%' : '上传文件' }}</el-button>
                        <el-button :disabled="downloading || !canDownload" :loading="downloading" title="最多 300 个文件，总大小不超过 500 MB" @click="downloadAll">{{ downloading ? '打包中' : '下载全部' }}</el-button>
                        <input ref="uploadInput" type="file" hidden @change="uploadFile">
                    </div>
                <div class="gallery-actions">

                    <el-select v-model="sort.field" style="width: 130px" @change="handleSortChange">
                        <el-option label="套图排序" value="album"></el-option>
                        <el-option label="创建时间" value="created"></el-option>
                        <el-option label="文件名称" value="name"></el-option>
                        <el-option label="随机排序" value="random"></el-option>
                    </el-select>
                    <el-select v-model="sort.order" :disabled="sort.field === 'random'" style="width: 130px" @change="handleSortChange">
                        <el-option label="倒序" value="desc"></el-option>
                        <el-option label="正序" value="asc"></el-option>
                    </el-select>
                    <el-button @click="goBack">返回</el-button>
                </div>
            </div>
        </template>

        <el-alert v-if="errorMessage" class="dashboard-alert" :title="errorMessage" type="error"
                  show-icon :closable="false"></el-alert>
        <div v-if="!loading && !images.length" class="gallery-empty">当前文件夹为空</div>
        <div ref="galleryGrid" v-loading="loading" class="gallery-grid">
            <button v-for="(image, index) in visibleImages" :key="image.folderPath || image.url"
                    class="gallery-item" type="button"
                     :data-gallery-index="index"
                    :aria-label="image.type === 'folder' ? '进入文件夹 ' + image.name : undefined"
                    :class="{
                        'is-loaded': image.loaded,
                        'is-video': image.type === 'video',
                        'is-folder': image.type === 'folder'
                    }"
                     @click="handleGalleryItemClick(index)"
                     @pointerdown="startGalleryImageLongPress($event, image)"
                     @pointermove="trackGalleryImageLongPress"
                     @pointerup="finishGalleryImageLongPress"
                     @pointercancel="cancelGalleryImageLongPress"
                     @pointerleave="cancelGalleryImageLongPress"
                     @contextmenu.prevent>
                <div v-if="image.type === 'folder'" class="gallery-folder-tile">
                    <div class="gallery-folder-visual" aria-hidden="true">
                        <img v-if="image.posterUrl" class="gallery-folder-poster-image"
                             :src="image.posterUrl" alt="" loading="lazy" decoding="async" draggable="false"
                             @load="markImageLoaded($event, image)" @error="image.posterUrl = null">
                        <div v-else class="gallery-folder-icon">
                            <svg viewBox="0 0 180 132">
                                <path d="M10 35c0-9 7-16 16-16h45l16 17h67c9 0 16 7 16 16v59c0 9-7 16-16 16H26c-9 0-16-7-16-16V35Z"></path>
                                <path class="folder-face"
                                      d="M10 52h160v59c0 9-7 16-16 16H26c-9 0-16-7-16-16V52Z"></path>
                            </svg>
                        </div>
                    </div>
                    <span class="gallery-folder-name" :title="image.name">{{ image.name }}</span>
                </div>
                <template v-else>
                    <el-skeleton v-if="!image.loaded" class="gallery-image-skeleton" animated>
                        <template #template>
                            <el-skeleton-item variant="image"></el-skeleton-item>
                        </template>
                    </el-skeleton>
                    <img v-if="image.type === 'video' && !image.loadError"
                         :class="{ 'is-loading': !image.loaded }"
                         :src="image.thumbnailUrl" :alt="image.name" loading="lazy" decoding="async"
                         draggable="false" @load="markVideoLoaded($event, image)"
                         @error="handleGalleryVideoError(image)">
                    <div v-else-if="image.type === 'video'" class="gallery-video-fallback" aria-hidden="true">▶</div>
                    <div v-else-if="image.loadError" class="gallery-image-error">
                        <span>图片预览失败</span>
                        <small :title="image.name">{{ image.name }}</small>
                    </div>
                    <img v-else :class="{ 'is-loading': !image.loaded }"
                         :src="image.thumbnailUrl || image.url" :alt="image.name"
                         loading="eager" decoding="async" draggable="false"
                         @load="markImageLoaded($event, image)"
                         @error="handleGalleryImageError($event, image)">
                    <span v-if="image.type === 'video'" class="gallery-video-badge" aria-hidden="true">
                        <span class="gallery-video-play">▶</span>
                        <small>{{ image.durationText || '视频' }}</small>
                    </span>
                    <span v-if="image.type === 'video' && image.loadError" class="gallery-video-error">
                        无法生成视频预览
                    </span>
                </template>
            </button>
        </div>
        <div v-if="visibleImages.length < images.length" class="gallery-load-more" aria-live="polite">
            下滑加载更多（已显示 {{ visibleImages.length }} / {{ images.length }}）
        </div>

        <teleport to="body">
            <transition name="gallery-resume">
                <div v-if="resumePromptVisible && resumePosition" class="gallery-resume-toast"
                     role="status" aria-live="polite">
                    <button class="gallery-resume-action" type="button" @click="restoreSavedGalleryPosition">
                        <span class="gallery-resume-icon" aria-hidden="true">↥</span>
                        <span>
                            <strong>回到上次浏览位置</strong>
                            <small>继续查看第 {{ resumePosition.index + 1 }} 项附近</small>
                        </span>
                    </button>
                    <button class="gallery-resume-close" type="button" aria-label="关闭位置提示"
                            @click="dismissResumePrompt">×</button>
                </div>
            </transition>
        </teleport>

        <teleport to="body">
            <transition name="cinema" @after-leave="handleViewerAfterLeave">
                <div v-if="viewerVisible && currentImage" ref="viewerRoot" class="cinema-viewer"
                     :class="{
                         'is-video': currentImage.type === 'video',
                         'is-folder': currentImage.type === 'folder'
                     }"
                     role="dialog" aria-modal="true"
                     :aria-label="currentImage.type === 'folder' ? '文件夹 ' + currentImage.name : '媒体预览'"
                     tabindex="-1"
                     @click="handleViewerClick" @dblclick.stop.prevent="toggleViewerZoom"
                     @pointerdown="startViewerMouseLongPress"
                     @pointermove="trackViewerMouseLongPress"
                     @pointerup="finishViewerMouseLongPress"
                     @pointercancel="clearViewerMouseLongPress"
                     @pointerleave="clearViewerMouseLongPress"
                     @touchstart="handleViewerTouchStart"
                     @touchmove="handleViewerTouchMove"
                     @touchend="handleViewerTouchEnd"
                     @touchcancel="handleViewerTouchEnd"
                     @contextmenu.prevent>
                    <div class="cinema-viewer-track" :style="viewerTrackStyle"
                         @transitionend.self="handleViewerTrackTransitionEnd">
                        <div v-for="(slide, slideIndex) in viewerSlides" :key="slide.id"
                             class="cinema-viewer-slide" :aria-hidden="slideIndex === 1 ? undefined : 'true'">
                            <div class="cinema-viewer-media">
                                <div v-if="slide.image && slide.image.type === 'folder'"
                                     class="cinema-viewer-folder"
                                     :class="{ 'cinema-viewer-preview': slideIndex !== 1 }">
                                    <div class="gallery-folder-visual" aria-hidden="true">
                                        <img v-if="slide.image.posterUrl" class="gallery-folder-poster-image"
                                             :src="slide.image.posterUrl" alt="" decoding="async"
                                             draggable="false" @load="markImageLoaded($event, slide.image)" @error="slide.image.posterUrl = null">
                                        <div v-else class="gallery-folder-icon">
                                            <svg viewBox="0 0 180 132">
                                                <path d="M10 35c0-9 7-16 16-16h45l16 17h67c9 0 16 7 16 16v59c0 9-7 16-16 16H26c-9 0-16-7-16-16V35Z"></path>
                                                <path class="folder-face"
                                                      d="M10 52h160v59c0 9-7 16-16 16H26c-9 0-16-7-16-16V52Z"></path>
                                            </svg>
                                        </div>
                                    </div>
                                    <span class="gallery-folder-name" :title="slide.image.name">{{ slide.image.name
                                        }}</span>
                                </div>
                                <img v-else-if="slide.image && slide.image.type !== 'video' && !slide.loadError && slide.image.thumbnailUrl"
                                     class="cinema-viewer-placeholder"
                                     :src="slide.image.thumbnailUrl" alt="" aria-hidden="true"
                                     decoding="async" draggable="false" @error="hideViewerPreview">
                                <div v-if="slide.image && slide.image.type === 'image' && slide.loadError"
                                     class="cinema-viewer-image-error">
                                    <span>图片无法加载</span>
                                    <small>{{ slide.image.name }}</small>
                                </div>
                                <img v-else-if="slide.image && slide.image.type === 'image'" class="cinema-viewer-image"
                                     :class="{
                                         'cinema-viewer-preview': slideIndex !== 1,
                                         'is-pending': slide.originalRequested && !slide.originalReady
                                     }"
                                      :src="slide.originalRequested
                                          ? slide.image.url : (slide.image.thumbnailUrl || slide.image.url)"
                                      :alt="slideIndex === 1 ? slide.image.name : ''"
                                      :style="slideIndex === 1 ? viewerImageStyle : undefined"
                                     decoding="async" draggable="false"
                                     @contextmenu.stop
                                     @load="handleViewerSlideLoad($event, slide, slideIndex)"
                                     @error="handleViewerSlideError($event, slide, slideIndex)">
                                <img v-else-if="slide.image && slide.image.type === 'video' && !slide.originalRequested"
                                     class="cinema-viewer-video-poster" :src="slide.image.thumbnailUrl"
                                     alt="" decoding="async" draggable="false"
                                     @error="hideViewerPreview">
                                <gallery-video-player v-else-if="slide.image && slide.image.type === 'video' && slide.originalRequested && slideIndex === 1"
                                       :key="slide.id" :slide="slide"
                                       @metadata="handleViewerVideoMetadata($event, slide)"
                                       @error="handleViewerVideoError(slide)"></gallery-video-player>
                                <div v-if="slide.image && slide.image.type === 'video' && !slide.originalReady && !slide.loadError"
                                     class="cinema-viewer-video-preview" aria-hidden="true">▶
                                </div>
                                <div v-if="slide.image && slide.image.type === 'video' && slide.loadError"
                                     class="cinema-viewer-video-error">
                                    <strong>无法播放此视频</strong>
                                    <small>当前浏览器可能不支持该视频格式</small>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button class="cinema-viewer-nav cinema-viewer-prev" type="button" aria-label="上一项"
                            @click.stop="previousViewerImage" @dblclick.stop @touchstart.stop>‹
                    </button>
                    <button class="cinema-viewer-nav cinema-viewer-next" type="button" aria-label="下一项"
                            @click.stop="nextViewerImage" @dblclick.stop @touchstart.stop>›
                    </button>
                    <button v-if="currentImage.type === 'video'" class="cinema-viewer-close" type="button"
                            aria-label="关闭视频预览" @click.stop="closeViewer" @dblclick.stop
                            @touchstart.stop>×
                    </button>
                </div>
            </transition>
        </teleport>

        <teleport to="body">
            <transition name="image-info">
                <div v-if="imageInfoVisible" class="image-info-backdrop" role="dialog" aria-modal="true"
                     aria-label="文件信息" @click.self="closeImageInfo">
                    <section class="image-info-card">
                        <header>
                            <strong>{{ imageInfo.typeText }}信息</strong>
                            <button type="button" aria-label="关闭文件信息" @click="closeImageInfo">×</button>
                        </header>
                        <dl>
                            <div>
                                <dt>文件名</dt>
                                <dd>{{ imageInfo.name }}</dd>
                            </div>
                            <div>
                                <dt>文件大小</dt>
                                <dd :title="imageInfo.sizeBytes ? imageInfo.sizeBytes.toLocaleString() + ' bytes' : ''">
                                    {{ imageInfo.sizeText }}
                                </dd>
                            </div>
                            <div>
                                <dt>修改时间</dt>
                                <dd>{{ imageInfo.modifiedText }}</dd>
                            </div>
                            <div v-if="imageInfo.dimensionsText">
                                <dt>{{ imageInfo.dimensionsLabel }}</dt>
                                <dd>{{ imageInfo.dimensionsText }}</dd>
                            </div>
                            <div v-if="imageInfo.durationText">
                                <dt>视频时长</dt>
                                <dd>{{ imageInfo.durationText }}</dd>
                            </div>
                        </dl>
                        <div class="image-info-actions">
                            <a v-if="imageInfo.url" class="image-info-download" :href="imageInfo.url"
                               :download="imageInfo.name" @click.stop>
                                下载原文件
                            </a>
                        </div>
                    </section>
                </div>
            </transition>
        </teleport>
    </el-card>
</template>

<template id="crawl-history-template">
    <el-card class="dashboard-card management-card" shadow="never">
        <template #header>
            <div class="management-heading">
                <div>
                    <p class="section-kicker">CRAWL HISTORY</p>
                    <h2>历史爬取记录</h2>
                </div>
                <el-button :loading="loading" @click="loadHistory(page)">刷新</el-button>
            </div>
        </template>

        <el-form class="filter-form history-filter" :inline="true" @submit.prevent="loadHistory(1)">
            <el-form-item label="URL">
                <el-input v-model.trim="filters.keyword" clearable placeholder="URL 关键字"
                          @keyup.enter="loadHistory(1)"></el-input>
            </el-form-item>
            <el-form-item label="状态">
                <el-select v-model="filters.done" clearable placeholder="全部状态" style="width: 130px">
                    <el-option label="已完成" :value="true"></el-option>
                    <el-option label="未完成" :value="false"></el-option>
                </el-select>
            </el-form-item>
            <el-form-item label="创建时间">
                <el-date-picker v-model="filters.dateRange" type="datetimerange" range-separator="至"
                                start-placeholder="开始时间" end-placeholder="结束时间"
                                value-format="YYYY-MM-DD HH:mm:ss"></el-date-picker>
            </el-form-item>
            <el-form-item>
                <el-button type="primary" native-type="submit">查询</el-button>
                <el-button @click="resetFilters">重置</el-button>
            </el-form-item>
        </el-form>

        <el-table class="responsive-desktop-table" :data="rows" row-key="id" stripe table-layout="fixed"
                  empty-text="没有匹配的爬取记录"
                  v-loading="loading">
            <el-table-column prop="id" label="ID" width="90"></el-table-column>
            <el-table-column prop="artistId" label="画师 ID" width="110">
                <template #default="scope">{{ scope.row.artistId ?? '—' }}</template>
            </el-table-column>
            <el-table-column label="URL" min-width="420">
                <template #default="scope">
                    <el-link class="url-link" :href="scope.row.url" :title="scope.row.url"
                             target="_blank" type="primary">
                        {{ scope.row.url }}
                    </el-link>
                </template>
            </el-table-column>
            <el-table-column prop="gmtCreate" label="创建时间" width="180"></el-table-column>
            <el-table-column label="状态" width="100" align="center">
                <template #default="scope">
                    <el-tag :type="scope.row.isDone ? 'success' : 'warning'" effect="light">
                        {{ scope.row.isDone ? '已完成' : '未完成' }}
                    </el-tag>
                </template>
            </el-table-column>
            <el-table-column prop="errorCount" label="错误次数" width="100" align="right"></el-table-column>
        </el-table>

        <div class="responsive-mobile-list mobile-history-list" v-loading="loading">
            <div v-if="!loading && !rows.length" class="mobile-empty">没有匹配的爬取记录</div>
            <article v-for="row in rows" :key="row.id" class="mobile-history-row">
                <header>
                    <strong>#{{ row.id }}</strong>
                    <el-tag :type="row.isDone ? 'success' : 'warning'" effect="light" size="small">
                        {{ row.isDone ? '已完成' : '未完成' }}
                    </el-tag>
                </header>
                <a class="mobile-history-url" :href="row.url" target="_blank"
                   rel="noopener noreferrer">{{ row.url }}</a>
                <footer>
                    <span>画师 ID {{ row.artistId ?? '—' }}</span>
                    <time>{{ row.gmtCreate || '—' }}</time>
                    <span>错误 {{ row.errorCount || 0 }} 次</span>
                </footer>
            </article>
        </div>

        <div class="management-footer">
            <span>共 {{ total }} 条</span>
            <el-pagination v-model:current-page="page" v-model:page-size="pageSize" background
                           layout="sizes, prev, pager, next" :page-sizes="[10, 20, 50, 100]" :total="total"
                           @current-change="loadHistory" @size-change="changePageSize"></el-pagination>
        </div>
    </el-card>
</template>

<noscript>此管理页面需要启用 JavaScript。</noscript>
<script src="/dashboard/vendor/vue.global.prod.js" defer></script>
<script src="/dashboard/vendor/vue-router.global.prod.js" defer></script>
<script src="/dashboard/vendor/element-plus.full.min.js" defer></script>
<script src="/dashboard/vendor/echarts.min.js" defer></script>
<script src="/dashboard/auth.js" defer></script>
<script src="/dashboard/pages/user-management.js" defer></script>
<script src="/dashboard/pages/scheduled-tasks.js" defer></script>
<script src="/dashboard/pages/dashboard-home.js" defer></script>
<script src="/dashboard/pages/artist-management.js" defer></script>
<script src="/dashboard/pages/free-gallery.js" defer></script>
<script src="/dashboard/vendor/xgplayer/index.min.js" defer></script>
<script src="/dashboard/pages/artist-gallery.js" defer></script>
<script src="/dashboard/pages/crawl-history.js" defer></script>
<script src="/dashboard/app.js" defer></script>
</body>
</html>
